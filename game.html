<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fish With Do (Computer)</title>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <button id="soundHint" class="sound-hint">Tap here to enable sound</button>

      <header>
        <h1>Fish With Do</h1>
        <span id="status" class="status">Preparing pairing…</span>
        <span id="debug" class="tilt-debug"></span>
      </header>

      <div id="pairWrap">
        <div id="pairPanel" class="panel">
          <h2>Pair two phones</h2>
          <p id="qrHint" class="hint">Generating the QR codes…</p>

          <div class="pair-duo">
            <div class="pair-col p1">
              <span class="pair-tag">Player 1 · red</span>
              <div class="qr-box hidden">
                <img id="pairQR1" class="qr" alt="Pairing QR for Player 1" />
              </div>
              <p id="roomCode1" class="room-code"></p>
              <details class="fallback">
                <summary>QR won't scan? Open this URL</summary>
                <input id="linkUrl1" readonly />
                <button id="copyUrlBtn1">Copy URL</button>
              </details>
            </div>

            <div class="pair-col p2">
              <span class="pair-tag">Player 2 · blue</span>
              <div class="qr-box hidden">
                <img id="pairQR2" class="qr" alt="Pairing QR for Player 2" />
              </div>
              <p id="roomCode2" class="room-code"></p>
              <details class="fallback">
                <summary>QR won't scan? Open this URL</summary>
                <input id="linkUrl2" readonly />
                <button id="copyUrlBtn2">Copy URL</button>
              </details>
            </div>
          </div>

          <div class="pair-row">
            <button id="startGameBtn" class="primary">Start game</button>
            <button id="newSessionBtn" class="ghost">New codes</button>
          </div>
        </div>
      </div>
      <button id="pairToggle" class="pair-toggle hidden">Pairing</button>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
