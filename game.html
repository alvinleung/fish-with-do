<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fish With Do (Computer)</title>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <button id="soundHint" class="sound-hint">Tap here to enable sound</button>

      <header>
        <h1>Fish With Do</h1>
        <span id="status" class="status">Preparing pairing…</span>
        <span id="debug" class="tilt-debug"></span>
      </header>

      <div id="pairWrap">
        <div class="pair-duo">
          <div class="pair-col p1">
            <span class="pair-tag">Player 1</span>
            <img id="pairQR1" class="qr" alt="Pairing QR for Player 1" />
          </div>
          <div class="pair-col p2">
            <span class="pair-tag">Player 2</span>
            <img id="pairQR2" class="qr" alt="Pairing QR for Player 2" />
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
