<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze Ball (Computer)</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Maze Ball</h1>
        <span id="status" class="status">Preparing pairing…</span>
        <span id="tiltDebug" class="tilt-debug"></span>
      </header>

      <div id="pair" class="panel">
        <h2>Pair your phone</h2>
        <img id="pairQR" class="qr hidden" alt="Pairing QR — scan with your phone" />
        <p id="roomCode" class="room-code"></p>
        <p id="qrHint" class="hint">Generating the QR code…</p>
        <div class="pair-row">
          <details class="fallback">
            <summary>QR won't scan? Open this URL on your phone</summary>
            <input id="linkUrl" readonly />
            <button id="copyUrlBtn">Copy URL</button>
          </details>
          <button id="newSessionBtn" class="ghost">New code</button>
        </div>
      </div>

      <div id="stage">
        <canvas id="game"></canvas>
        <div id="winOverlay" class="overlay hidden">
          <div class="overlay-card">
            <h2>You escaped</h2>
            <p id="winTime"></p>
            <button id="againBtn" class="primary">Play again</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
