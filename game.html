<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fish With Do (Computer)</title>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <button id="soundHint" class="sound-hint">Tap here to enable sound</button>

      <header>
        <h1>Fish With Do</h1>
        <span id="status" class="status">Preparing pairing…</span>
        <span id="debug" class="tilt-debug"></span>
      </header>

      <div id="pairWrap">
        <div class="pair-duo">
          <div class="pair-col p1">
            <span class="pair-tag">Player 1</span>
            <img id="pairQR1" class="qr" alt="Pairing QR for Player 1" />
          </div>
          <div class="pair-col p2">
            <span class="pair-tag">Player 2</span>
            <img id="pairQR2" class="qr" alt="Pairing QR for Player 2" />
          </div>
        </div>
      </div>

      <!-- JRPG-style character dialogue box (bottom center) -->
      <div id="dialogue" class="hidden">
        <div id="dlgName" class="dlg-name"></div>
        <img id="dlgPortrait" class="dlg-portrait" alt="" />
        <div class="dlg-body">
          <div id="dlgText" class="dlg-text"></div>
          <div id="dlgCaret" class="dlg-caret">▼</div>
          <div id="dlgChoices" class="dlg-choices hidden">
            <button id="dlgYes" class="dlg-choice">Yes</button>
            <button id="dlgNo" class="dlg-choice">No</button>
          </div>
        </div>
      </div>

      <!-- End-of-day market: item-by-item tally for each player -->
      <div id="dayEnd" class="end-screen hidden">
        <div class="end-card">
          <h2 id="dayEndTitle">End of Day 1</h2>
          <div class="end-cols">
            <div class="end-col">
              <h3 class="p1">Player 1</h3>
              <ul class="dayend-list" id="dayEndList1"></ul>
              <div class="end-total" id="dayEndTotal1">$0</div>
            </div>
            <div class="end-col">
              <h3 class="p2">Player 2</h3>
              <ul class="dayend-list" id="dayEndList2"></ul>
              <div class="end-total" id="dayEndTotal2">$0</div>
            </div>
          </div>
          <button id="dayEndBtn" class="end-btn hidden">Start Day 2</button>
        </div>
      </div>

      <!-- Final results after the last day -->
      <div id="gameOver" class="end-screen hidden">
        <div class="end-card">
          <h2>Final Results</h2>
          <div class="end-cols">
            <div class="end-col">
              <h3 class="p1">Player 1</h3>
              <ul class="gameover-list" id="gameOverDays1"></ul>
              <div class="end-sub" id="gameOverBest1">Best day: $0</div>
              <div class="end-total" id="gameOverTotal1">Grand total: $0</div>
            </div>
            <div class="end-col">
              <h3 class="p2">Player 2</h3>
              <ul class="gameover-list" id="gameOverDays2"></ul>
              <div class="end-sub" id="gameOverBest2">Best day: $0</div>
              <div class="end-total" id="gameOverTotal2">Grand total: $0</div>
            </div>
          </div>
          <button id="playAgainBtn" class="end-btn">Play again</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
