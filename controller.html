<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fish Reel (Phone)</title>
  </head>
  <body>
    <div id="app">
      <h1>Fish With Do</h1>
      <p class="sub">
        You are the reel. Lean left/right to aim the rod, flick the phone to
        throw the line, spin the wheel with your finger to crank it, and tap
        the wheel to strike.
      </p>

      <div id="reel">
        <img id="reelBg" alt="" />
        <img id="reelFg" alt="" />
      </div>

      <div id="status" class="status">Idle</div>

      <button id="startBtn" class="primary">Enable motion</button>
      <p id="tiltReadout" class="tilt-readout">Tap “Enable motion”, then hold the phone like a rod</p>

      <div id="pair" class="panel">
        <h2>Connection</h2>
        <p id="roomCode" class="room-code"></p>
        <p id="pairHint" class="hint">Pairing with the game…</p>
      </div>
    </div>
    <script type="module" src="/src/controller/main.ts"></script>
  </body>
</html>
