<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Controller (Phone)</title>
  </head>
  <body>
    <div id="app">
      <h1>Controller</h1>
      <p class="sub">Hold your phone and tilt to steer the ball.</p>
      <div id="status" class="status">Idle</div>

      <button id="startBtn" class="primary">Enable motion</button>
      <p id="tiltReadout" class="tilt-readout">Tap “Enable motion”, then tilt your phone</p>

      <div id="pair" class="panel">
        <h2>Connection</h2>
        <p id="roomCode" class="room-code"></p>
        <p id="pairHint" class="hint">Pairing with the game…</p>
      </div>
    </div>
    <script type="module" src="/src/controller/main.ts"></script>
  </body>
</html>
