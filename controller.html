<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Controller (Phone)</title>
  </head>
  <body>
    <div id="app">
      <h1>Controller</h1>
      <p class="sub">Hold your phone and tilt to steer the ball.</p>
      <div id="status" class="status">Idle</div>

      <button id="startBtn" class="primary">Enable motion</button>

      <div id="pair" class="panel">
        <h2>Connection</h2>
        <p id="pairHint" class="hint">Pairing with the game…</p>

        <div id="answerWrap" class="hidden">
          <h3>Your answer</h3>
          <p class="hint">
            Copy this and paste it into the computer's answer box — it connects
            automatically.
          </p>
          <textarea id="answerBox" readonly placeholder="answer will appear here"></textarea>
          <button id="copyAnswerBtn" class="primary">Copy answer</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/controller/main.ts"></script>
  </body>
</html>
