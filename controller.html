<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fish Reel (Phone)</title>
  </head>
  <body>
    <div id="app">
      <!-- Screen 1: motion permission prompt (shown until motion is granted) -->
      <div id="perm" class="screen">
        <h1>Fish With Do</h1>
        <p class="perm-sub">
          You're the reel — lean to aim, spin the wheel to crank, tap to strike.
          This reads your phone's motion to control the rod (no camera).
        </p>
        <button id="permBtn" class="primary">Enable motion to play</button>
        <p id="permNote" class="hint"></p>
      </div>

      <!-- Screen 2: just the wheel (shown once motion is granted) -->
      <div id="wheelView" class="screen hidden">
        <div id="reel">
          <img id="reelBg" alt="" />
          <img id="reelFg" alt="" />
        </div>
      </div>

      <!-- Kept hidden; shown only for edge cases (e.g. opened without a room) -->
      <div id="status" class="status hidden"></div>
    </div>
    <script type="module" src="/src/controller/main.ts"></script>
  </body>
</html>
